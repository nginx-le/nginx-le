server {
    listen   443 ssl;
    server_name _;

    root /srv/docroot/;

    ssl_certificate         SSL_CERT;
    ssl_certificate_key     SSL_KEY;
    ssl_trusted_certificate SSL_CHAIN_CERT;

    # a level with its own add_header drops the global headers from nginx.conf unless merged,
    # and merging applies to nested blocks too, so each header is set at one level only
    add_header_inherit merge;
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload";

    limit_conn perip 10;

    access_log off;

    location /api/ {
        add_header Application-Name secrets;

        #CORS
        # browsers refuse credentials with a wildcard origin, so allowing them needs a specific origin
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, DELETE, OPTIONS';
        if ($request_method = 'OPTIONS') {
             add_header 'Access-Control-Max-Age'        86400;
             add_header 'Access-Control-Allow-Headers' 'Authorization,DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
             add_header 'Content-Length' 0;
             add_header 'Content-Type' 'text/plain; charset=UTF-8';
             return 204;
         }

         proxy_redirect          off;
         proxy_set_header        X-Real-IP $remote_addr;
         proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header        Host $http_host;
         proxy_pass              http://1.2.3.4:8080/;
     }
}
