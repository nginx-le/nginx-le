# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      "GitHub Actions updates":
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    # odd nginx minors are mainline, even ones are stable: skip the listed odd
    # series with their patch releases. no update-types here, dependabot
    # ignores the union of both keys, so semver-minor would also block every
    # stable upgrade.
    ignore:
      - dependency-name: "nginx"
        versions:
          - "~> 1.27.0"
          - "~> 1.29.0"
          - "~> 1.31.0"
          - "~> 1.33.0"
          - "~> 1.35.0"
          - "~> 1.37.0"
          - "~> 1.39.0"
